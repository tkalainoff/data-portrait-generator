<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- PLACEHOLDER: Strategy — muted blue, ascending bar pattern -->
  <rect width="600" height="600" fill="#4A7FB5"/>
  <defs>
    <pattern id="strategy-bars" x="0" y="0" width="90" height="90" patternUnits="userSpaceOnUse">
      <polygon points="15,80 25,45 35,80" fill="white" opacity="0.12"/>
      <polygon points="50,80 60,28 70,80" fill="white" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#strategy-bars)"/>
  <!-- Subtle highlight diagonals -->
  <line x1="-60" y1="200" x2="660" y2="740" stroke="white" stroke-width="80" opacity="0.04"/>
  <line x1="-60" y1="0"   x2="660" y2="540" stroke="white" stroke-width="80" opacity="0.04"/>
</svg>
