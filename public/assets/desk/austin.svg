<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- PLACEHOLDER: Austin — guitar silhouette (Live Music Capital) -->
  <!-- Body -->
  <ellipse cx="30" cy="42" rx="14" ry="14" fill="#795548"/>
  <!-- Soundhole -->
  <circle cx="30" cy="42" r="5" fill="#5D4037"/>
  <!-- Neck -->
  <rect x="27" y="10" width="6" height="32" rx="3" fill="#6D4C41"/>
  <!-- Headstock -->
  <rect x="22" y="7"  width="16" height="8" rx="3" fill="#6D4C41"/>
  <!-- Tuning pegs -->
  <circle cx="22" cy="9"  r="2.5" fill="#BDBDBD"/>
  <circle cx="38" cy="9"  r="2.5" fill="#BDBDBD"/>
  <circle cx="22" cy="14" r="2.5" fill="#BDBDBD"/>
  <circle cx="38" cy="14" r="2.5" fill="#BDBDBD"/>
  <!-- Strings -->
  <line x1="28" y1="12" x2="28" y2="40" stroke="#D4A017" stroke-width="0.8"/>
  <line x1="30" y1="12" x2="30" y2="40" stroke="#D4A017" stroke-width="0.8"/>
  <line x1="32" y1="12" x2="32" y2="40" stroke="#D4A017" stroke-width="0.8"/>
</svg>
