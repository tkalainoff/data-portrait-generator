<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- PLACEHOLDER: Strategy — chess knight on dark blue circle -->
  <circle cx="30" cy="30" r="28" fill="#1565C0"/>
  <!-- Simplified chess knight head (abstract) -->
  <ellipse cx="30" cy="22" rx="9" ry="10" fill="white"/>
  <!-- Neck/body -->
  <rect x="24" y="30" width="12" height="10" rx="2" fill="white"/>
  <!-- Base -->
  <rect x="19" y="40" width="22" height="5"  rx="2" fill="white"/>
  <!-- Snout -->
