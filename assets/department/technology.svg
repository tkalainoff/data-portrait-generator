<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- PLACEHOLDER: Technology — muted green, dot matrix grid -->
  <rect width="600" height="600" fill="#3A8A6E"/>
  <defs>
    <pattern id="tech-dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.5" fill="white" opacity="0.28"/>
    </pattern>
    <pattern id="tech-lines" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <line x1="16" y1="0" x2="16" y2="32" stroke="white" stroke-width="0.5" opacity="0.1"/>
      <line x1="0" y1="16" x2="32" y2="16" stroke="white" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#tech-lines)"/>
  <rect width="600" height="600" fill="url(#tech-dots)"/>
</svg>
